<!doctype html>

<title>A&Z Girls Fashion</title>
<style>
:root{--bg:#050505;--card:#111;--gold:#d9a62e;--gold2:#ffe28a;--text:#fff;--muted:#c9c9c9}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#251b08 0,#090909 35%,#000 100%);font-family:Arial,Tahoma,sans-serif;color:var(--text);display:flex;justify-content:center;padding:26px 14px}
.card{width:min(100%,480px);background:linear-gradient(145deg,rgba(24,24,24,.96),rgba(5,5,5,.98));border:1px solid #6d531e;border-radius:28px;padding:28px 20px;box-shadow:0 20px 60px #000,inset 0 0 35px rgba(218,166,46,.05)}
.logo{width:170px;height:170px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#050505;border:3px solid var(--gold);box-shadow:0 0 0 5px #191306,0 0 30px rgba(217,166,46,.25);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}.fallback{font-family:Georgia,serif;font-size:55px;font-weight:700;color:var(--gold2)}
h1{margin:4px 0 5px;text-align:center;letter-spacing:2px;color:var(--gold2);font-size:25px} .tag{text-align:center;color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 22px}
.links{display:grid;gap:11px}.link{display:flex;align-items:center;gap:13px;padding:14px 16px;text-decoration:none;color:#fff;background:#131313;border:1px solid #34290f;border-radius:16px;transition:.2s;box-shadow:inset 0 0 0 1px rgba(255,226,138,.02)}.link:hover{transform:translateY(-2px);border-color:var(--gold);background:#191608}.icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),#a97000);display:grid;place-items:center;color:#090909;font-weight:900;font-size:17px;flex:none}.icon svg{width:24px;height:24px;display:block;fill:currentColor}.label{font-weight:700}.hint{font-size:12px;color:#aaa;margin-top:3px;direction:ltr;text-align:right}
footer{text-align:center;color:#8f8f8f;font-size:11px;margin-top:22px}.edit{margin-top:18px;padding:12px;border:1px dashed #705922;border-radius:12px;color:#b7a36a;font-size:11px;line-height:1.7}
</style>
</head>
