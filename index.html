<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="ms-sp-authoring-source" content="agent">
  <title>A&Z Girls Fashion</title>
<style>
    :root {
      --bg: #090909;
      --bg2: #1a140b;
      --card: rgba(18, 18, 18, 0.96);
      --gold: #d9a62e;
      --gold-soft: #f6d98e;
      --text: #ffffff;
      --muted: #d3d3d3;
      --line: rgba(217, 166, 46, 0.32);
      --shadow: rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      color: var(--text);
      background: radial-gradient(circle at top, #2a1e0d 0%, #12100d 28%, #090909 70%, #000 100%);
      font-family: "Tahoma", "Segoe UI", "Arial", sans-serif;
    }

    body.lang-en {
      direction: ltr;
      text-align: left;
    }

    body.lang-ar {
      direction: rtl;
      text-align: right;
    }

    .card {
      width: min(100%, 500px);
      background: linear-gradient(180deg, rgba(22, 22, 22, 0.98), rgba(7, 7, 7, 0.99));
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 18px 18px;
      box-shadow: 0 24px 60px var(--shadow), inset 0 0 35px rgba(217, 166, 46, 0.07);
      position: relative;
    }

    .lang-switch {
      position: absolute;
      top: 14px;
      left: 14px;
      border: 1px solid var(--gold);
      background: rgba(217, 166, 46, 0.08);
      color: var(--gold-soft);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
      z-index: 2;
    }

    body.lang-en .lang-switch {
      left: 14px;
    }

    body.lang-ar .lang-switch {
      left: auto;
      right: 14px;
    }

    .lang-switch:hover {
      background: rgba(217, 166, 46, 0.18);
      transform: translateY(-1px);
    }

    .logo {
      width: 170px;
      height: 170px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #050505;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 5px rgba(217, 166, 46, 0.12), 0 0 30px rgba(217, 166, 46, 0.22);
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .fallback {
      font-family: "Times New Roman", Georgia, serif;
      font-size: 56px;
      font-weight: 700;
      color: var(--gold-soft);
      display: none;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--gold-soft);
      font-size: clamp(23px, 4vw, 28px);
      letter-spacing: 1.5px;
      font-family: "Tahoma", "Segoe UI", "Arial", sans-serif;
    }

    .tag {
      margin: 10px 0 22px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      font-family: "Tahoma", "Segoe UI", "Arial", sans-serif;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(217, 166, 46, 0.22);
      border-radius: 16px;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      font-family: "Tahoma", "Segoe UI", "Arial", sans-serif;
    }

    .link:hover,
    .link:focus-visible {
      transform: translateY(-2px);
      border-color: var(--gold);
      background: rgba(217, 166, 46, 0.06);
      outline: none;
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--gold-soft), #b87a00);
      color: #111;
      font-weight: 900;
      font-size: 15px;
      flex: none;
    }

    .icon svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: currentColor;
    }

    .text-wrap {
      min-width: 0;
      flex: 1;
    }

    .label,
    .hint {
      font-family: "Tahoma", "Segoe UI", "Arial", sans-serif;
    }

    .label {
      font-weight: 700;
      font-size: 15px;
    }

    .hint {
      margin-top: 2px;
      font-size: 12px;
      color: #c7c7c7;
      direction: ltr;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.lang-ar .hint {
      text-align: right;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: #aaaaaa;
      font-size: 11px;
      letter-spacing: 0.5px;
      font-family: "Tahoma", "Segoe UI", "Arial", sans-serif;
    }
  </style>
</head>
<body class="lang-ar">

    <div class="logo">

          <div class="label" data-i18n="call">اتصل بنا</div>

      <a class="link" href="https://facebook.com/azgirlsfashion" target="_blank" rel="noreferrer">

        </span>

      </a>

      <a class="link" href="mailto:hello@azgirlsfashion.com">
        <span class="icon">@</span>
        <div class="text-wrap">

        </div>
      </a>
    </section>

    <footer data-i18n="footer">© A&Z Girls Fashion</footer>
  </main>

  <script>
    const translations = {
      title: { ar: 'A&Z GIRLS FASHION', en: 'A&Z GIRLS FASHION' },
      tag: {
        ar: 'كل ما تحتاجينه من A & Z<br>ملابس • أحذية • حقائب • إكسسوارات',
        en: 'Everything you need from A & Z<br>Clothes • Shoes • Bags • Accessories'
      },
      whatsapp: { ar: 'واتساب', en: 'WhatsApp' },
      call: { ar: 'اتصل بنا', en: 'Call Us' },
      location: { ar: 'الموقع', en: 'Location' },
      email: { ar: 'البريد الإلكتروني', en: 'Email' },
      footer: { ar: '© A&Z Girls Fashion', en: '© A&Z Girls Fashion' }
    };

    const langToggle = document.getElementById('langToggle');
    const elements = [...document.querySelectorAll('[data-i18n]')];

    function setLanguage(lang) {
      document.body.classList.toggle('lang-ar', lang === 'ar');
      document.body.classList.toggle('lang-en', lang === 'en');
      document.documentElement.lang = lang;

      elements.forEach((el) => {
        const key = el.dataset.i18n;
        if (translations[key] && translations[key][lang]) {
          el.innerHTML = translations[key][lang];
        }
      });

      langToggle.textContent = lang === 'ar' ? 'EN' : 'AR';
      langToggle.setAttribute('aria-label', lang === 'ar' ? 'Switch to English' : 'التبديل للعربية');
    }

    langToggle.addEventListener('click', () => {
      const currentLang = document.body.classList.contains('lang-en') ? 'en' : 'ar';
      setLanguage(currentLang === 'ar' ? 'en' : 'ar');
    });

    setLanguage('ar');
  </script>
</body>
</html>
